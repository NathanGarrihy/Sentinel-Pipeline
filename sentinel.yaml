sentinel:
  version: "0.1.0"
  policy_version: "0.1.0"

  scanners:
    - name: semgrep
      command: ["semgrep", "scan", "--json", "--metrics=off", "--config", ".semgrep.yml", "{target}"]
      type: sast
      required: true

    - name: trivy
      command: ["trivy", "fs", "--format", "json", "{target}"]
      type: sca
      required: true

    - name: checkov
      command: ["checkov", "-d", "{target}", "--output", "json"]
      type: iac
      required: false

    - name: syft
      command: ["syft", "scan", "{target}", "--output", "json"]
      type: sbom
      required: true

  signing:
    tool: cosign
    required: true
