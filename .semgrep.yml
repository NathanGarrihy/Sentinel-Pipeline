rules:
  # ── Hardcoded secrets ────────────────────────────────────────────────────

  - id: hardcoded-password
    patterns:
      - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|secret|api_key|apikey|token|auth)
    message: Possible hardcoded secret in variable '$VAR'. Use environment variables or a secrets manager.
    languages: [python]
    severity: ERROR

  - id: hardcoded-password-kwarg
    patterns:
      - pattern: $FUNC(..., password="...", ...)
    message: Hardcoded password passed as keyword argument to '$FUNC'.
    languages: [python]
    severity: ERROR

  # ── Dangerous functions ──────────────────────────────────────────────────

  - id: dangerous-eval
    pattern: eval(...)
    message: Use of eval() is dangerous — it executes arbitrary code. Refactor to avoid dynamic evaluation.
    languages: [python]
    severity: ERROR

  - id: dangerous-exec
    pattern: exec(...)
    message: Use of exec() is dangerous — it executes arbitrary code.
    languages: [python]
    severity: ERROR

  - id: subprocess-shell-true
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
    message: shell=True in subprocess calls enables shell injection. Pass arguments as a list instead.
    languages: [python]
    severity: ERROR

  - id: os-system
    pattern: os.system(...)
    message: os.system() is vulnerable to shell injection. Use subprocess with a list of arguments.
    languages: [python]
    severity: WARNING

  # ── SQL injection ────────────────────────────────────────────────────────

  - id: sql-string-format
    patterns:
      - pattern: $CURSOR.execute("..." % ...)
    message: SQL query built with string formatting is vulnerable to injection. Use parameterised queries.
    languages: [python]
    severity: ERROR

  - id: sql-fstring
    patterns:
      - pattern: $CURSOR.execute(f"...")
    message: SQL query built with f-string is vulnerable to injection. Use parameterised queries.
    languages: [python]
    severity: ERROR

  # ── Weak cryptography ────────────────────────────────────────────────────

  - id: weak-hash-md5
    patterns:
      - pattern: hashlib.md5(...)
    message: MD5 is cryptographically broken. Use SHA-256 or stronger.
    languages: [python]
    severity: WARNING

  - id: weak-hash-sha1
    patterns:
      - pattern: hashlib.sha1(...)
    message: SHA-1 is deprecated for security use. Use SHA-256 or stronger.
    languages: [python]
    severity: WARNING

  # ── Insecure deserialisation ─────────────────────────────────────────────

  - id: pickle-load
    patterns:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
    message: pickle.load/loads deserialises arbitrary Python objects — remote code execution risk. Use JSON or a safe alternative.
    languages: [python]
    severity: ERROR

  - id: yaml-unsafe-load
    patterns:
      - pattern: yaml.load(..., ...)
    message: yaml.load() with an untrusted loader allows arbitrary code execution. Use yaml.safe_load() instead.
    languages: [python]
    severity: ERROR

  # ── Temporary file handling ──────────────────────────────────────────────

  - id: insecure-tempfile
    patterns:
      - pattern: tempfile.mktemp(...)
    message: tempfile.mktemp() has a race condition. Use tempfile.mkstemp() or tempfile.NamedTemporaryFile() instead.
    languages: [python]
    severity: WARNING
